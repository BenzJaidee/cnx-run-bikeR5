<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CNX RUN BIKE Registration</title>
<style>
  :root{
    /* ถ้ายังเห็นแบนเนอร์ Google Apps Script ด้านบน ให้เปลี่ยนเป็น 44px (หรือ 48px)
       เพื่อดันแบนเนอร์ออกนอกจอ  ถ้าไม่เห็นแบนเนอร์ ให้คงเป็น 0px */
    --gas-banner-offset: 0px;
    --bg: #000;
    --accent: #c6283d;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;background:var(--bg);
    -webkit-text-size-adjust:100%;
  }
  body{
    height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Thai","Segoe UI",Roboto,sans-serif;
  }
  .frame-wrap{
    position:relative;width:100%;height:100%;overflow:hidden;
  }
  iframe#app{
    position:absolute;left:0;border:0;display:block;
    top:calc(var(--gas-banner-offset) * -1);
    width:100%;
    height:calc(100% + var(--gas-banner-offset));
    background:var(--bg);
  }

  /* Loading screen */
  #loader{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:var(--bg);color:#fff;
    opacity:1;transition:opacity .5s ease;
  }
  #loader.hide{opacity:0;pointer-events:none}
  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:4px solid rgba(255,255,255,.15);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  .loader-title{font-size:18px;font-weight:600;letter-spacing:.3px}
  .loader-sub{font-size:14px;color:#a1a1a6;margin-top:-12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="spinner"></div>
  <div class="loader-title">CNX RUN BIKE</div>
  <div class="loader-sub">กำลังโหลด...</div>
</div>

<div class="frame-wrap">
  <iframe
    id="app"
    title="CNX RUN BIKE Registration"
    src="https://script.google.com/macros/s/AKfycbx9H2Sp7uGB1POfOb7LhICnUpp8o2nQN5ktv5BWnHPev4Vl4dPobytsj7vtVX8-RE4Gaw/exec"
    allow="fullscreen"
    allowfullscreen
    scrolling="no"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
(function () {
  var loader = document.getElementById('loader');
  var frame  = document.getElementById('app');
  var done = false;

  function hideLoader() {
    if (done) return;
    done = true;
    loader.classList.add('hide');
    setTimeout(function () { loader.style.display = 'none'; }, 600);
  }

  frame.addEventListener('load', hideLoader);
  // กันค้าง: ถ้าโหลดนานผิดปกติ ให้เอา loader ออกเพื่อให้เห็นหน้าเว็บ
  setTimeout(hideLoader, 15000);
})();
</script>
</body>
</html>
